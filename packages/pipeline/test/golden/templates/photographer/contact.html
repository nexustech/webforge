<body class="flex min-h-screen flex-col bg-base-100 font-sans text-base-content">
  <!-- Header (shared) -->
  <header class="site-header relative z-30 navbar gap-2 px-4 bg-base-100 shadow-sm">
    <div class="flex-1"><a class="font-heading text-xl font-bold" href="index.html">Rowan Hale Photography</a></div>
    <nav aria-label="Main navigation">
      <ul class="menu menu-horizontal hidden p-0 md:flex">

      <details class="site-menu md:hidden" data-wf-menu="">
        <summary class="btn btn-square btn-ghost list-none [&amp;::-webkit-details-marker]:hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">

        <ul class="menu absolute inset-x-0 top-full z-10 w-full bg-base-100 p-2 shadow">
          <li><a href="index.html">Home</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="about.html">About</a></li>

        </ul>

    </nav>

  <main id="main" class="flex-1">
    <section class="site-contact-form bg-base-100 px-4 py-16">
      <div class="mx-auto max-w-xl space-y-8">
        <div class="text-center">
          <h2 class="font-heading text-h2">Get in touch</h2>
          <div class="mt-4 text-body [&amp;_a:not(.btn)]:[text-decoration-line:var(--wf-link-decoration,underline)] [&amp;_a:not(.btn):hover]:[text-decoration-line:var(--wf-link-hover-decoration,underline)] [&amp;_a:not(.btn):focus-visible]:[text-decoration-line:var(--wf-link-hover-decoration,underline)] [&amp;_a:not(.btn)]:[color:var(--wf-link-color,currentColor)] [&amp;_p+p]:mt-4 [&amp;_ol]:my-3 [&amp;_ol]:list-decimal [&amp;_ol]:pl-6 [&amp;_ul]:my-3 [&amp;_ul]:list-disc [&amp;_ul]:pl-6">
            <div class="contents">
              <p>Tell me what you'd like photographed, where and roughly when. I'll reply within two days.</p>
            </div>
          </div>
        </div>
        <form class="site-form space-y-4" accept-charset="UTF-8" aria-label="Contact form" data-wf-form-unset="noService" method="post">
          <div class="site-form-field space-y-1"><label class="block font-medium" for="contactform-20-name">Name<span class="text-error" aria-hidden="true"> *</span></label><input id="contactform-20-name" type="text" class="input w-full" required="" aria-required="true" autoComplete="name" name="name" /></div>
          <div class="site-form-field space-y-1"><label class="block font-medium" for="contactform-20-email">Email address<span class="text-error" aria-hidden="true"> *</span></label><input id="contactform-20-email" type="email" class="input w-full" required="" aria-required="true" autoComplete="email" name="email" /></div>
          <div class="site-form-field space-y-1"><label class="block font-medium" for="contactform-20-message">Message<span class="text-error" aria-hidden="true"> *</span></label><textarea id="contactform-20-message" name="message" rows="5" class="textarea w-full" required="" aria-required="true"></textarea></div>
          <div hidden=""><label>Leave this empty<input type="text" tabindex="-1" autoComplete="off" name="_gotcha" /></label></div><button type="submit" class="btn btn-primary" disabled="">Send</button>
        </form>
      </div>
    </section>
  </main>
  <!-- Footer (shared) -->
  <footer class="site-footer footer footer-center bg-base-200 p-8 text-base-content">

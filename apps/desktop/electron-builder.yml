# electron-builder configuration: https://www.electron.build/configuration
# Builds are unsigned for now; code signing and notarisation come with the release pipeline.
appId: app.webforge.desktop
productName: Webforge
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  # The fonts go beside app.asar instead (below).
  - "!out/fonts/**"
  - package.json
  # Production dependencies (only better-sqlite3) are added from node_modules automatically.
  # Ship only the prebuilt binary for the platform being packaged, not SQLite's C sources.
  - "!**/node_modules/better-sqlite3/{deps,src,binding.gyp}"
  - "!**/node_modules/better-sqlite3/prebuilds/!(${platform}-${arch}).node"
  - "!**/node_modules/node-addon-api/**"
# The installer's fonts (2.2), outside app.asar as plain files: the main process checks each one
# against the font catalogue's SHA-256 when it reads it.
extraResources:
  - from: out/fonts
    to: fonts
asar: true
# Native addons can't be loaded from inside an asar archive.
asarUnpack:
  - "**/*.node"
# better-sqlite3 ships Node-API prebuilds that load in Electron as they are: nothing to rebuild
# (ADR 0003). Rebuilding would also rewrite the shared pnpm store copy used by unit tests.
npmRebuild: false

# Double-clicking a .wforge opens it in Webforge (P1). The main process reads the path from argv.
fileAssociations:
  - ext: wforge
    name: Webforge site
    role: Editor

# Electron Fuses: switch off Node-style entry points into the packaged app.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Flipping fuses invalidates the macOS signature; re-sign ad hoc so unsigned arm64 builds still
  # launch (Apple Silicon refuses unsigned code). Only applies to .app bundles.
  resetAdHocDarwinSignature: true

win:
  target:
    - target: nsis
      arch: [x64]

# Per-user install: no administrator rights needed.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  minimumSystemVersion: "13.0"
  # Unsigned until a Developer ID certificate is set up in CI.
  identity: null

dmg:
  artifactName: ${productName}-${version}-arm64.${ext}

publish: null

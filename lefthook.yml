# Git hooks: https://lefthook.dev/configuration/
# Installed automatically by `pnpm install` (lefthook's postinstall).

pre-commit:
  jobs:
    - name: biome
      # Every kind of file `pnpm lint` (`biome ci .`) checks, Markdown and YAML included: CI skips
      # its Check job on docs-only PRs, so a badly formatted .md would otherwise reach main.
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,css,md,yml,yaml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: gitleaks
      # The commits being pushed, checked for secrets (5.24, OL-13): git names them on stdin. The
      # first push downloads the pinned Gitleaks and checks its SHA-256; allowed test values are in
      # .gitleaks.toml.
      run: node tools/src/gitleaks.ts
      use_stdin: true

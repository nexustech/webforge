name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from the packageManager field in package.json.
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format (biome ci)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Package boundaries (dependency-cruiser)
        run: pnpm deps

      - name: Unused code and dependencies (knip)
        run: pnpm knip

      - name: Dependency licences (C1)
        # Runs on every OS because each installs its own platform-specific binary packages.
        run: pnpm licence-check

      - name: Tests with coverage
        run: pnpm test

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Allow the Chromium sandbox (Linux)
        # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox needs.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install browsers for the exported-site tests
        # The export projects open the exported site from disk in all three engines (X1, C8).
        run: pnpm --filter @webforge/e2e exec playwright install --with-deps chromium firefox webkit

      - name: Electron E2E tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e

      - name: Electron E2E tests
        if: runner.os != 'Linux'
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: e2e/playwright-report/
          if-no-files-found: ignore

  package:
    # Packages the app with electron-builder (asar, Fuses, unpacked better-sqlite3 binary) and
    # checks that the packaged app opens a .wforge (ADR 0003). macOS runs here only: Windows
    # machines can't build or run the macOS app.
    name: Packaged app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package (electron-builder --dir) and test the packaged app
        run: pnpm e2e:packaged

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-packaged-${{ matrix.os }}
          path: e2e/playwright-report/
          if-no-files-found: ignore

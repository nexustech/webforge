name: Merge queue

# Stands in for GitHub's merge queue, which needs an organisation-owned repository (spec/03 §7).
# `main` requires "CI passed" on a branch that is up to date with `main`, and pull requests merge
# themselves with auto-merge. GitHub doesn't update a branch that has fallen behind, so this does,
# one pull request at a time:
# - A PR that is up to date with `main` and whose CI is running, or has passed, is in flight: wait
#   for it. Nothing else is touched until it merges or fails.
# - Otherwise the next PR that is behind `main`, and whose CI hasn't failed, gets `main` merged in
#   and a fresh CI run: docs-only PRs first (their CI takes seconds), then the oldest auto-merge.
# - PRs with conflicts or failing CI are skipped. Their stream's Auto-fix resolves the conflict or
#   fixes CI and pushes (or re-runs a flaky job), which puts them back in the queue.
# "Behind" comes from comparing the PR's head with `main`, not from GitHub's merge state, which
# reads UNKNOWN for a while after every merge.
# It runs after every push to `main` (a merge), every finished CI run, when auto-merge is turned
# on, and every 15 minutes as a safety net.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [auto_merge_enabled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only say what would happen
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # One at a time, and none dropped: each run looks at the queue afresh.
  group: merge-queue
  cancel-in-progress: false

jobs:
  next:
    name: Bring the next pull request up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find and update the next pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run == true }}
        run: |
          set -euo pipefail
          # Only a pull request's own CI runs count for its required "CI passed": "Run workflow"
          # runs aren't linked to it. When this workflow updates a branch, GitHub starts the PR's CI
          # run but holds it for approval, as the push comes from a bot (the approval rule for
          # outside contributors), so this approves it.
          #
          # The latest pull-request CI run on a commit, as "id state": state is NONE, WAITING
          # (held for approval), RUNNING, SUCCESS or the failure's conclusion.
          ci_of() {
            gh run list --workflow ci.yml --commit "$1" --event pull_request \
              --json databaseId,status,conclusion,createdAt \
              --jq 'sort_by(.createdAt) | last
                | if . == null then "0 NONE"
                  elif .conclusion == "action_required" then "\(.databaseId) WAITING"
                  elif .status != "completed" then "\(.databaseId) RUNNING"
                  else "\(.databaseId) \(.conclusion | ascii_upcase)" end'
          }
          # Approves the PR's CI run held on commit `$1`, once it appears.
          approve_ci() {
            if [ "$DRY_RUN" = true ]; then return; fi
            for _ in $(seq 30); do
              read -r id state <<< "$(ci_of "$1")"
              if [ "$state" = WAITING ]; then
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" > /dev/null
                echo "Approved CI run $id."
                return
              fi
              [ "$state" = NONE ] || return
              sleep 2
            done
            echo "::warning::No CI run appeared for $1: push to the branch to start one."
          }
          # Commits on main that commit `$1` doesn't have: 0 when it's up to date with main.
          behind_by() {
            gh api "repos/$GH_REPO/compare/main...$1" --jq .behind_by
          }
          # Whether PR `$1` changes docs only, by the rule of ci.yml's `changes` job (keep the two in
          # step): its CI runs nothing but "CI passed", so it merges within a minute of its update.
          docs_only() {
            local files
            files=$(gh api "repos/$GH_REPO/pulls/$1/files" --paginate --jq '.[].filename')
            ! grep -Evq '^(docs|spec|research)/|\.md$' <<< "$files"
          }
          # Merges main into PR `$1` (branch `$2`, head `$3`) and approves the CI run that starts.
          # Fails, changing nothing, if GitHub can't merge main in (a conflict).
          update() {
            echo "#$1 is behind main: merging main into $2 and running CI."
            if [ "$DRY_RUN" = true ]; then return 0; fi
            gh api -X PUT "repos/$GH_REPO/pulls/$1/update-branch" -f expected_head_sha="$3" > /dev/null || return 1
            # GitHub updates the branch in the background: approve its CI once the new head is there.
            local new="$3"
            for _ in $(seq 30); do
              new=$(gh api "repos/$GH_REPO/pulls/$1" --jq .head.sha)
              [ "$new" != "$3" ] && break
              sleep 2
            done
            approve_ci "$new"
          }
          # Open, ready PRs into main from this repository with auto-merge on, oldest first, as
          # "number branch head mergeState". "CI passed" appears only when every other job has
          # finished, so a running CI is found from the runs on the head commit.
          queue=$(gh pr list --base main --state open --limit 100 \
            --json number,isDraft,isCrossRepository,headRefName,headRefOid,mergeStateStatus,autoMergeRequest \
            --jq '[.[] | select(.autoMergeRequest != null and (.isDraft | not) and (.isCrossRepository | not))]
              | sort_by(.autoMergeRequest.enabledAt) | .[]
              | "\(.number) \(.headRefName) \(.headRefOid) \(.mergeStateStatus)"')
          if [ -z "$queue" ]; then
            echo "No pull requests are waiting to auto-merge."
            exit 0
          fi
          echo "$queue"
          # First, a PR in flight: up to date with main, its CI held, running or passed. Behind PRs
          # that can go next are collected, docs-only ones apart.
          docs=()
          others=()
          while read -r number branch head state; do
            if [ "$state" = DIRTY ]; then
              echo "#$number has conflicts with main: its stream resolves them."
              continue
            fi
            behind=$(behind_by "$head")
            read -r _ ci <<< "$(ci_of "$head")"
            case "$ci" in
              FAILURE | TIMED_OUT | STARTUP_FAILURE)
                echo "#$number failed CI ($ci): its stream fixes it."
                continue
                ;;
            esac
            if [ "$behind" -gt 0 ]; then
              # A run on a head that is behind can't merge whatever it finds, so it doesn't count
              # as in flight: the update replaces it (CI's concurrency group cancels it).
              if docs_only "$number"; then docs+=("$number $branch $head"); else others+=("$number $branch $head"); fi
              continue
            fi
            case "$ci" in
              WAITING)
                echo "#$number's CI is held for approval: approving it."
                approve_ci "$head"
                exit 0
                ;;
              RUNNING | NONE)
                # NONE: just pushed, and GitHub hasn't started its CI yet.
                echo "#$number is in flight ($ci): waiting for its CI."
                exit 0
                ;;
              SUCCESS)
                echo "#$number passed CI and is up to date ($state): waiting for auto-merge."
                exit 0
                ;;
              *)
                # Cancelled, or another conclusion: run it again once something else moves it on.
                echo "#$number's CI ended $ci on an up-to-date head: push or re-run to try again."
                ;;
            esac
          done <<< "$queue"
          # Nothing in flight: update the next behind PR, docs-only ones first. One GitHub can't
          # merge main into has a conflict, which its stream resolves; the next one is tried.
          for entry in "${docs[@]}" "${others[@]}"; do
            read -r number branch head <<< "$entry"
            if update "$number" "$branch" "$head"; then exit 0; fi
            echo "#$number couldn't take main (a conflict): its stream resolves it."
          done
          echo "Nothing to update: every queued pull request is waiting on its stream."

name: Merge queue

# Stands in for GitHub's merge queue, which needs an organisation-owned repository (spec/03 §7).
# `main` requires "CI passed" on a branch that is up to date with `main`, and pull requests merge
# themselves with auto-merge. GitHub doesn't update a branch that has fallen behind, so this does,
# one pull request at a time:
# - A PR that is up to date with `main` and whose CI is running, or has passed, is in flight: wait
#   for it. Nothing else is touched until it merges or fails.
# - Otherwise the next PR that is behind `main`, and whose CI hasn't failed, gets `main` merged in
#   and a fresh CI run: docs-only PRs first (their CI takes seconds), then the oldest auto-merge.
# - PRs with conflicts or failing CI are skipped. Their stream's Auto-fix resolves the conflict or
#   fixes CI and pushes (or re-runs a flaky job), which puts them back in the queue.
# "Behind" comes from comparing the PR's head with `main`, not from GitHub's merge state, which
# reads UNKNOWN for a while after every merge.
# It runs after every push to `main` (a merge), every finished CI run, when auto-merge is turned
# on, and once an hour as a safety net (every 15 minutes until 31 Oct 2026: the schedule made 256
# of the 440 runs from 28 to 31 Oct; research/stack/09). The hourly run also reports every PR that
# has waited more than an hour, and whose move it is: the `report` job below (#1523).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [auto_merge_enabled]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only say what would happen
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # One at a time, and none dropped: each run looks at the queue afresh.
  group: merge-queue
  cancel-in-progress: false

jobs:
  next:
    name: Bring the next pull request up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find and update the next pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run == true }}
        run: |
          set -euo pipefail
          # Only a pull request's own CI runs count for its required "CI passed": "Run workflow"
          # runs aren't linked to it. When this workflow updates a branch, GitHub starts the PR's CI
          # run but holds it for approval, as the push comes from a bot (the approval rule for
          # outside contributors), so this approves it.
          #
          # The latest pull-request CI run on a commit, as "id state": state is NONE, WAITING
          # (held for approval), RUNNING, SUCCESS or the failure's conclusion.
          ci_of() {
            gh run list --workflow ci.yml --commit "$1" --event pull_request \
              --json databaseId,status,conclusion,createdAt \
              --jq 'sort_by(.createdAt) | last
                | if . == null then "0 NONE"
                  elif .conclusion == "action_required" then "\(.databaseId) WAITING"
                  elif .status != "completed" then "\(.databaseId) RUNNING"
                  else "\(.databaseId) \(.conclusion | ascii_upcase)" end'
          }
          # Approves the PR's CI run held on commit `$1`, once it appears.
          approve_ci() {
            if [ "$DRY_RUN" = true ]; then return; fi
            for _ in $(seq 30); do
              read -r id state <<< "$(ci_of "$1")"
              if [ "$state" = WAITING ]; then
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" > /dev/null
                echo "Approved CI run $id."
                return
              fi
              [ "$state" = NONE ] || return
              sleep 2
            done
            echo "::warning::No CI run appeared for $1: push to the branch to start one."
          }
          # Commits on main that commit `$1` doesn't have: 0 when it's up to date with main.
          behind_by() {
            gh api "repos/$GH_REPO/compare/main...$1" --jq .behind_by
          }
          # Whether PR `$1` changes docs only, by the rule of ci.yml's `changes` job (keep the two in
          # step): its CI runs nothing but "CI passed" (and the help pages' check when it changes
          # them), so it merges within a few minutes of its update.
          docs_only() {
            local files
            files=$(gh api "repos/$GH_REPO/pulls/$1/files" --paginate --jq '.[].filename')
            ! grep -Evq '^(docs|spec|research)/|\.md$' <<< "$files"
          }
          # Merges main into PR `$1` (branch `$2`, head `$3`) and approves the CI run that starts.
          # Fails, changing nothing, if GitHub can't merge main in (a conflict).
          update() {
            echo "#$1 is behind main: merging main into $2 and running CI."
            if [ "$DRY_RUN" = true ]; then return 0; fi
            gh api -X PUT "repos/$GH_REPO/pulls/$1/update-branch" -f expected_head_sha="$3" > /dev/null || return 1
            # GitHub updates the branch in the background: approve its CI once the new head is there.
            local new="$3"
            for _ in $(seq 30); do
              new=$(gh api "repos/$GH_REPO/pulls/$1" --jq .head.sha)
              [ "$new" != "$3" ] && break
              sleep 2
            done
            approve_ci "$new"
          }
          # Open, ready PRs into main from this repository with auto-merge on, oldest first, as
          # "number branch head mergeState". "CI passed" appears only when every other job has
          # finished, so a running CI is found from the runs on the head commit.
          queue=$(gh pr list --base main --state open --limit 100 \
            --json number,isDraft,isCrossRepository,headRefName,headRefOid,mergeStateStatus,autoMergeRequest \
            --jq '[.[] | select(.autoMergeRequest != null and (.isDraft | not) and (.isCrossRepository | not))]
              | sort_by(.autoMergeRequest.enabledAt) | .[]
              | "\(.number) \(.headRefName) \(.headRefOid) \(.mergeStateStatus)"')
          if [ -z "$queue" ]; then
            echo "No pull requests are waiting to auto-merge."
            exit 0
          fi
          echo "$queue"
          # First, a PR in flight: up to date with main, its CI held, running or passed. Behind PRs
          # that can go next are collected, docs-only ones apart.
          docs=()
          others=()
          while read -r number branch head state; do
            if [ "$state" = DIRTY ]; then
              echo "#$number has conflicts with main: its stream resolves them."
              continue
            fi
            behind=$(behind_by "$head")
            read -r _ ci <<< "$(ci_of "$head")"
            case "$ci" in
              FAILURE | TIMED_OUT | STARTUP_FAILURE)
                echo "#$number failed CI ($ci): its stream fixes it."
                continue
                ;;
            esac
            if [ "$behind" -gt 0 ]; then
              # A run on a head that is behind can't merge whatever it finds, so it doesn't count
              # as in flight: the update replaces it (CI's concurrency group cancels it).
              if docs_only "$number"; then docs+=("$number $branch $head"); else others+=("$number $branch $head"); fi
              continue
            fi
            case "$ci" in
              WAITING)
                echo "#$number's CI is held for approval: approving it."
                approve_ci "$head"
                exit 0
                ;;
              RUNNING | NONE)
                # NONE: just pushed, and GitHub hasn't started its CI yet.
                echo "#$number is in flight ($ci): waiting for its CI."
                exit 0
                ;;
              SUCCESS)
                echo "#$number passed CI and is up to date ($state): waiting for auto-merge."
                exit 0
                ;;
              *)
                # Cancelled, or another conclusion: run it again once something else moves it on.
                echo "#$number's CI ended $ci on an up-to-date head: push or re-run to try again."
                ;;
            esac
          done <<< "$queue"
          # Nothing in flight: update the next behind PR, docs-only ones first. One GitHub can't
          # merge main into has a conflict, which its stream resolves; the next one is tried.
          for entry in "${docs[@]}" "${others[@]}"; do
            read -r number branch head <<< "$entry"
            if update "$number" "$branch" "$head"; then exit 0; fi
            echo "#$number couldn't take main (a conflict): its stream resolves it."
          done
          echo "Nothing to update: every queued pull request is waiting on its stream."

  # Each hour, and on "Run workflow": the open, ready PRs into main whose last push is more than an
  # hour old, what each waits for and whose move it is (#1523). The queue above takes only a PR
  # with auto-merge on, no conflict and no failed CI; any other waits for someone, and this says
  # who. Written to the run's summary and, unless a dry run, as the body of the pinned issue
  # "Stuck pull requests" (an edit notifies nobody). The runs a merge, a CI run or auto-merge
  # starts don't write it. It shares the workflow's concurrency group, which keeps one run waiting:
  # a scheduled run replaced by a later one while another runs skips that hour, and the report's
  # time shows it.
  report:
    name: Report the pull requests that are waiting
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    steps:
      - name: Write the report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run == true }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Stuck pull requests"
          now=$(date -u +%s)
          # The latest pull-request CI run on commit `$1`, as "state created": state as the queue's
          # job reads it (NONE, WAITING, RUNNING, SUCCESS or the conclusion), and when GitHub started
          # the run, which is when the commit was pushed ("-" with no run).
          ci_of() {
            gh run list --workflow ci.yml --commit "$1" --event pull_request \
              --json status,conclusion,createdAt \
              --jq 'sort_by(.createdAt) | last
                | if . == null then "NONE -"
                  elif .conclusion == "action_required" then "WAITING \(.createdAt)"
                  elif .status != "completed" then "RUNNING \(.createdAt)"
                  else "\(.conclusion | ascii_upcase) \(.createdAt)" end'
          }
          # A conclusion in words: TIMED_OUT as "timed out".
          words() { local w="${1,,}"; echo "${w//_/ }"; }
          # The row for one PR, or nothing if it hasn't waited an hour. Fails if GitHub can't be
          # read, so the caller can say so for that PR alone.
          row_for() {
            local number="$1" head="$2" mergeable="$3" auto="$4" url="$5" title="$6"
            local found ci created pushed hours behind state move
            found=$(ci_of "$head") || return 1
            read -r ci created <<< "$found"
            # Its last push: when its CI run started, or its head's commit date if it has none.
            if [ "$created" = - ]; then
              pushed=$(gh api "repos/$GH_REPO/commits/$head" --jq .commit.committer.date) || return 1
            else
              pushed="$created"
            fi
            hours=$(( (now - $(date -u -d "$pushed" +%s)) / 3600 ))
            [ "$hours" -ge 1 ] || return 0
            behind=$(gh api "repos/$GH_REPO/compare/main...$head" --jq .behind_by) || return 1
            if [ "$mergeable" = CONFLICTING ]; then
              state="Conflicts with main"
              move="Its stream: merge main in"
            elif [[ "$ci" =~ ^(FAILURE|TIMED_OUT|STARTUP_FAILURE)$ ]]; then
              # The failures the queue skips.
              state="CI failed ($(words "$ci"))"
              move="Its stream: fix and push (a flaky test: the flaky-test rule first)"
            elif [ "$auto" != true ]; then
              state="No auto-merge (CI $(words "$ci"), behind by $behind)"
              move="The coordinator: its merge review, or held on purpose"
            elif [ "$behind" -gt 0 ]; then
              state="Behind main by $behind"
              # Right after a merge GitHub may not know yet whether it conflicts.
              if [ "$mergeable" = UNKNOWN ]; then state+=" (whether it conflicts isn't known yet)"; fi
              move="The merge queue: it goes when the PRs ahead of it have"
            else
              case "$ci" in
                SUCCESS)
                  state="Up to date and green, not merged"
                  move="The coordinator: look, as auto-merge should have merged it"
                  ;;
                RUNNING | WAITING)
                  state="Up to date, CI $(words "$ci")"
                  move="The merge queue: waiting for its CI (it approves a held run)"
                  ;;
                NONE)
                  state="Up to date, no CI run"
                  move="Its stream: push to start CI. Until then it holds the queue"
                  ;;
                *)
                  state="Up to date, CI $(words "$ci")"
                  move="Its stream: re-run CI or push"
                  ;;
              esac
            fi
            echo "| [#$number]($url) $title | $hours h | $state | $move |"
          }
          # Open, ready PRs into main from this repository, oldest first, one per line:
          # number, head, mergeable, auto-merge, branch, URL and title, tab-separated. (Asking for
          # their commits here exceeds GraphQL's limit, so dates are read per PR above.) A title's
          # tabs, pipes and backslashes become spaces, and an @ in it can't mention anyone.
          prs=$(gh pr list --base main --state open --limit 100 \
            --json number,title,url,isDraft,isCrossRepository,headRefName,headRefOid,mergeable,autoMergeRequest \
            --jq 'map(select((.isDraft | not) and (.isCrossRepository | not))) | sort_by(.number) | .[]
              | [.number, .headRefOid, .mergeable, (.autoMergeRequest != null), .headRefName, .url,
                 (.title | gsub("[|\t\\\\]"; " ") | gsub("@"; "@​"))]
              | @tsv')
          rows=""
          release=""
          while IFS=$'\t' read -r number head mergeable auto branch url title; do
            [ -n "$number" ] || continue
            # The release pull request waits for a release on purpose (docs/releasing.md).
            if [[ "$branch" == release-please--* ]]; then
              release="$number"
              continue
            fi
            if row=$(row_for "$number" "$head" "$mergeable" "$auto" "$url" "$title"); then
              if [ -n "$row" ]; then rows+="$row"$'\n'; fi
            else
              rows+="| [#$number]($url) $title | ? | GitHub couldn't be read for it this hour | |"$'\n'
            fi
          done <<< "$prs"
          {
            echo "Open, ready pull requests into \`main\` whose last push is more than an hour old,"
            echo "at $(date -u '+%Y-%m-%d %H:%M') UTC. Written each hour by the [Merge queue workflow]($RUN_URL) (#1523), which replaces anything written here."
            echo
            if [ -z "$rows" ]; then
              echo "None: nothing has waited more than an hour."
            else
              echo "| Pull request | Since its last push | State | Whose move |"
              echo "| --- | --- | --- | --- |"
              printf '%s' "$rows"
            fi
            if [ -n "$release" ]; then
              echo
              echo "Left out: the release pull request, #$release, which waits for a release on purpose."
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          # Not by search, whose index can lag a new issue and make a second one.
          issue=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | first | .number // empty")
          if [ -z "$issue" ]; then
            gh issue create --title "$TITLE" --body-file report.md
          else
            gh issue edit "$issue" --body-file report.md > /dev/null
            echo "Updated #$issue."
          fi

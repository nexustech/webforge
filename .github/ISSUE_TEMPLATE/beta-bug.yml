name: Beta – something went wrong
description: Webforge did something it shouldn't, stopped working, or closed unexpectedly.
title: "[Beta] "
labels: ["beta", "type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Webforge. Everything you write here can be read by anyone, so please leave out passwords, your customers' details and anything else private. The [testers' guide](https://github.com/nexustech/webforge/blob/main/docs/beta/testers-guide.md) has more help.
  - type: input
    id: version
    attributes:
      label: Webforge version
      description: "Choose **Help › About Webforge**: it shows the version, for example `Version 0.9.0`."
      placeholder: Version 0.9.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Computer
      options:
        - Windows 11
        - Windows 10
        - Mac with Apple silicon (M1 or later), macOS 13 or later
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What you saw, in your own words. A screenshot helps; check it shows nothing private first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: The steps that led to it, as far as you remember them. "I don't know" is fine.
      placeholder: |
        1. Opened my site
        2. Added a Gallery section to the Home page
        3. Chose Publish…
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: |
        It helps us most when it comes with every report, and it holds your newest crash reports too, so there's no need to attach those as well. Choose **Help › Diagnostics…**, look through what it holds, click **Save Report…**, then drag the file it saves here. It holds what Webforge has counted on your computer, such as how many sites you exported, and your newest crash reports: nothing of your sites, and nothing private, so it's safe here, where anyone can read it. See [What Webforge counts on your computer](https://github.com/nexustech/webforge/blob/main/docs/help/saving-and-backups.md#what-appname-counts-on-your-computer).
    validations:
      required: false

packages:
  - apps/*
  - packages/*
  - e2e
  - tools

# Versions shared by several workspaces; reference them as "catalog:".
catalog:
  "@fontsource/inter": 5.3.0
  "@jsquash/jpeg": 1.6.0
  "@jsquash/png": 3.1.1
  "@jsquash/resize": 2.1.1
  "@jsquash/webp": 1.5.0
  "@types/better-sqlite3": 9.6.0
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # Node-API addon with prebuilt binaries for every platform; no install script (ADR 0003).
  better-sqlite3: 13.0.3
  daisyui: 5.7.50
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  vitest: 5.0.5
  zod: 4.6.7

# pnpm blocks dependency build scripts by default; approve only what we need.
allowBuilds:
  "@swc/core": true
  lefthook: true
  # Squirrel.Windows installer helper pulled in by electron-builder; we ship NSIS only.
  electron-winstaller: false
  # Storybook's bundler; its postinstall only re-checks the platform binary that the optional
  # @esbuild/<platform> package already provides.
  esbuild: false

# Puck 0.23 re-walks the whole page for permissions and re-publishes unchanged sidebar fields on
# every change; the patch skips both when nothing uses them (ADR 0007). It also exposes the canvas
# zoom, which Puck's API leaves out, for the engine's setZoom and onCanvasSize (1.15). pnpm fails
# the install if the patch no longer applies, e.g. after a Puck upgrade: check whether it is still
# needed then.
patchedDependencies:
  '@puckeditor/core@0.23.0': patches/@puckeditor__core@0.23.0.patch

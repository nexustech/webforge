packages:
  - apps/*
  - packages/*
  - e2e
  - tools

# Versions shared by several workspaces; reference them as "catalog:". GitHub's dependency graph
# reads "catalog:" as written, so Dependabot can't match these against advisories; a package with an
# open advisory is pinned in each manifest instead until it is fixed (happy-dom, see `overrides`).
# Renovate (renovate.json) does read the catalog, and updates it.
catalog:
  # React Compiler (ADR 0010) through Babel. The compiler is built against Babel 7.
  "@babel/core": 7.29.7
  "@jsquash/jpeg": 1.6.0
  "@jsquash/png": 3.1.1
  "@jsquash/resize": 2.1.1
  "@jsquash/webp": 1.5.0
  "@rolldown/plugin-babel": 0.2.4
  "@types/better-sqlite3": 9.6.0
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # Node-API addon with prebuilt binaries for every platform; no install script (ADR 0003).
  babel-plugin-react-compiler: 1.0.0
  better-sqlite3: 13.0.3
  daisyui: 5.7.50
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  vitest: 5.0.5
  zod: 4.6.7

# pnpm blocks dependency build scripts by default; approve only what we need.
allowBuilds:
  "@swc/core": true
  lefthook: true
  # Squirrel.Windows installer helper pulled in by electron-builder; we ship NSIS only.
  electron-winstaller: false
  # Storybook's bundler; its postinstall only re-checks the platform binary that the optional
  # @esbuild/<platform> package already provides.
  esbuild: false
  # SFTP publishing (ssh2, 0.3): its optional native crypto binding and cpu-features stay unbuilt,
  # so ssh2 runs on its JavaScript fallback in tests and in the app alike (ADR 0006, decision 7).
  ssh2: false
  cpu-features: false

# Puck 0.23 re-walks the whole page for permissions and re-publishes unchanged sidebar fields on
# every change; the patch skips both when nothing uses them (ADR 0007). It also exposes the canvas
# zoom, which Puck's API leaves out, for the engine's setZoom and onCanvasSize (1.15). pnpm fails
# the install if the patch no longer applies, e.g. after a Puck upgrade: check whether it is still
# needed then.
patchedDependencies:
  '@puckeditor/core@0.23.0': patches/@puckeditor__core@0.23.0.patch

# happy-dom, the DOM for Vitest, is pinned to 21.0.4 in each workspace that tests React
# (CVE-2026-33943, Dependabot alerts 2–5), not in the catalog: the dependency graph reads a
# "catalog:" range as it is written and can't match it against an advisory. Puck
# (@puckeditor/core 0.23.0) depends on happy-dom ^20 itself, and @tiptap/html has it as a peer
# (^20.8.9), which kept the vulnerable 20.14.6 in the lockfile; the override moves them to 21.0.4,
# outside their declared range. That is safe: Puck reaches happy-dom only through @tiptap/html's
# Node entry (`./server`), and the renderer, built by Vite, takes its browser entry, so the app
# never runs it. Keep the override at the pinned version, and drop it once a Puck release accepts
# happy-dom 21; the Puck upgrade test (ADR 0004) is where to check.
#
# js-beautify 2.0.3 (the pipeline's readable HTML and CSS) has glob ^13 and, through editorconfig,
# minimatch ~10.2, both with moderate advisories (GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249) that the
# production audit fails on (#656). js-beautify loads both only in its command-line tool
# (js/lib/cli.js); the pipeline calls its library, which never loads them. The overrides move them
# to the patched majors, outside the declared ranges, for those two paths only. Drop them once a
# js-beautify release takes the patched versions.
overrides:
  happy-dom: 21.0.4
  js-beautify>glob: 14.0.3
  editorconfig>minimatch: 11.0.3
